# Lịch tự động cập nhật kiến thức (APScheduler, chạy cùng FastAPI).
# Mỗi lần chạy một lĩnh vực: skill update-knowledge → agent knowledge-curator → git commit knowledge/ và .claude/.
# Giới hạn số lần chạy tự động mỗi ngày: MAX_DAILY_RUNS trong .env. Số lượt mỗi phiên: max_turns bên dưới.
# Bật/tắt trên giao diện (tab "Lịch tự động"); trạng thái bật/tắt lưu trong SQLite, giá trị dưới chỉ là mặc định lần đầu.

scheduler:
  enabled: true
  timezone: Asia/Ho_Chi_Minh
  max_turns: 30          # số lượt tối đa cho mỗi phiên tự động (không vượt MAX_TURNS trong .env)
  git_commit: true       # tự commit knowledge/ và .claude/ sau khi cập nhật
  jobs:
    # cron: phút giờ ngày tháng thứ (0 = Chủ nhật ... 6 = Thứ bảy; hoặc mon, tue, ...)
    - domain: ai
      cron: "0 8 * * *"        # hằng ngày 8h
    - domain: tai-chinh
      cron: "0 7 * * mon"      # thứ Hai 7h
    - domain: game
      cron: "0 9 * * mon"      # thứ Hai 9h
    - domain: cong-nghe-thong-tin
      cron: "0 8 * * sun"      # Chủ nhật 8h
    - domain: phat-trien-phan-mem
      cron: "0 9 * * sun"      # Chủ nhật 9h
    - domain: chung-khoan-viet-nam
      cron: "0 17 * * mon-fri" # thứ Hai–thứ Sáu 17h, khi báo chí đã đăng bản tin cuối phiên; cập nhật cap-nhat-cuoi-phien.md + top 10 theo dõi
      label: "bản tin cuối phiên"
      max_turns: 60            # phiên dài hơn mặc định vì phải đọc bảng chỉ báo và chọn top 10
      pre_steps: [market-data] # backend tải giá CafeF và tính chỉ báo trước khi gọi agent

# Dữ liệu chỉ báo kỹ thuật do backend tính (pre-step market-data). Nguồn giá: CafeF (một nguồn, không chính thức).
market_data:
  output: knowledge/_du-lieu/chung-khoan-viet-nam/chi-bao-cuoi-phien.md
  history_days: 260
  indices: [VNINDEX, VN30INDEX, HNX-INDEX, UPCOM-INDEX]
  # Danh sách mã được quét (không phải toàn thị trường). Sửa tuỳ ý; nên giữ các mã thanh khoản cao.
  # Endpoint CafeF này chỉ trả dữ liệu cho mã HOSE (mã HNX như SHS, PVS trả rỗng, kiểm tra 2026-11-17).
  tickers: [VIC, VHM, VRE, VNM, VCB, BID, CTG, TCB, MBB, VPB, ACB, HDB, STB, TPB, VIB, LPB, SHB,
            HPG, FPT, MWG, MSN, SAB, GAS, PLX, POW, SSI, VND, VCI, HCM, GVR, BCM, VJC, PNJ, REE,
            DGC, KDH, NLG, DXG, BVH]
